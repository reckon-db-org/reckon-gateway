name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']

jobs:
  # NO IMAGE WHILE THE TESTS ARE RED (mcl-om#34). Nothing ran the eunit suite
  # before. It runs in the Dockerfile's own builder stage, so it sees exactly
  # the toolchain (OTP, Rust for reckon-db's NIFs, rebar3) the image builds
  # with, and the build waits on it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the builder stage
        run: docker build --target builder -t reckon-gateway-builder .
      - name: rebar3 eunit
        run: docker run --rm -v "$PWD:/src" -w /src reckon-gateway-builder bash -c 'rebar3 grpc gen && rebar3 eunit'

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/reckon-db-org/reckon-gateway:latest
            ghcr.io/reckon-db-org/reckon-gateway:${{ steps.tag.outputs.tag }}
